spring:
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 8MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
  flyway:
    clean-disabled: true
    out-of-order: false
server:
  port: ${SERVER_PORT:8080}
civa:
  media-dir: ${CIVA_MEDIA_DIR:./build/private-media}
  nutrition:
    provider: ${CIVA_NUTRITION_PROVIDER:auto}
    api-key: ${CIVA_NUTRITION_API_KEY:}
    model: ${CIVA_NUTRITION_MODEL:deepseek-flash}
    endpoint: ${CIVA_NUTRITION_ENDPOINT:https://api.deepseek.com/chat/completions}
    cache-days: ${CIVA_NUTRITION_CACHE_DAYS:30}
    hourly-limit: ${CIVA_NUTRITION_HOURLY_LIMIT:60}
    daily-limit: ${CIVA_NUTRITION_DAILY_LIMIT:20}