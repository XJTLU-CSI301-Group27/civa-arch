plugins { alias(libs.plugins.android.library) }
android {
    namespace 'edu.xjtlu.civa.core.ui'
    compileSdk 36
    resourcePrefix 'civa_'
    defaultConfig { minSdk 26 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { viewBinding true }
    lint { error 'ResourceName' }
}
dependencies {
    // Theme, fonts and shared primitives are public API of this module: consumers need
    // AppCompatActivity in their own signatures (CivaWindow, PressBounce).
    api libs.appcompat
    implementation libs.material
    implementation libs.fragment
    implementation libs.annotation
    testImplementation libs.junit
}
